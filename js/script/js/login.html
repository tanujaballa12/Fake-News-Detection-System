```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Fake News Detection</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        body{
            background:
            linear-gradient(
                rgba(3,18,45,0.75),
                rgba(3,18,45,0.75)
            ),
            url("/static/images/login_bg.png");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: 'Poppins', sans-serif;
        }

        .login-card{
            width: 450px;
            border: none;
            border-radius: 20px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(15px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        .login-header{
            background: rgba(5, 51, 119, 0.85);
            color: white;
            text-align: center;
            padding: 30px;
        }

        .login-header i{
            font-size: 50px;
            margin-bottom: 10px;
        }

        .login-body{
            padding: 35px;
            color: white;
        }

        .form-control{
            border-radius: 10px;
            padding: 12px;
        }

        .btn-login{
            width: 100%;
            border-radius: 10px;
            font-weight: bold;
            padding: 12px;
        }

        .register-link{
            text-align: center;
            margin-top: 15px;
        }

        .register-link a{
            color: #e6ebf0;
            text-decoration: none;
            font-weight: 600;
        }

        .password-box{
            position: relative;
            margin-bottom: 20px;
        }

        .eye-icon{
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #666;
        }

        label{
            margin-bottom: 6px;
            font-weight: 500;
        }

    </style>
</head>

<body>

<div class="card login-card">

    <div class="login-header">
        <i class="fa-solid fa-newspaper"></i>
        <h2>Fake News Detector</h2>
        <p class="mb-0">Secure User Login</p>
    </div>

    <div class="login-body">

        <form method="POST">

            <div class="mb-3">
                <label>Email Address</label>
                <input type="email"
                       name="email"
                       class="form-control"
                       placeholder="Enter Email"
                       required>
            </div>

            <div class="password-box">

                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter Password"
                    required>

                <i class="fa-solid fa-eye eye-icon"
                   id="togglePassword"></i>

            </div>

            <button type="submit"
                    class="btn btn-primary btn-login">
                <i class="fa-solid fa-right-to-bracket"></i>
                Login
            </button>

        </form>

        <div class="register-link">
            Don't have an account?
            <a href="/register">Register Here</a>
        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
```
